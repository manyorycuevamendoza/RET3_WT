<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #F5F5F5;
        --ink: #002A8D;
        --accent: #F37021;
        --bcp-blue: #0063BD;
        --bcp-white: #FFFFFF;
        --success: #4CAF50;
        --error: #F44336;
        --font-display: 'Inter', sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: Hook -->
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 2: Push Permiso -->
      <div
        id="push-permiso"
        data-composition-id="push-permiso"
        data-composition-src="compositions/push-permiso.html"
        data-start="4"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 3: Llamada -->
      <div
        id="llamada"
        data-composition-id="llamada"
        data-composition-src="compositions/llamada.html"
        data-start="8"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 4: Código Voz -->
      <div
        id="codigo-voz"
        data-composition-id="codigo-voz"
        data-composition-src="compositions/codigo-voz.html"
        data-start="12"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 5: Push Código -->
      <div
        id="push-codigo"
        data-composition-id="push-codigo"
        data-composition-src="compositions/push-codigo.html"
        data-start="17"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 6: Ingreso -->
      <div
        id="ingreso"
        data-composition-id="ingreso"
        data-composition-src="compositions/ingreso.html"
        data-start="21"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 7: Verificado -->
      <div
        id="verificado"
        data-composition-id="verificado"
        data-composition-src="compositions/verificado.html"
        data-start="25"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 8: Error -->
      <div
        id="error"
        data-composition-id="error"
        data-composition-src="compositions/error.html"
        data-start="29"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 9: Cierre -->
      <div
        id="cierre"
        data-composition-id="cierre"
        data-composition-src="compositions/cierre.html"
        data-start="32"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
